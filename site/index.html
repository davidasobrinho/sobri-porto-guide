<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOBRI Porto Guide</title>
<meta name="description" content="Where to eat, drink and wander in Porto, picked by Cris & David from the SOBRI Cork House.">
<meta name="theme-color" content="#161718">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: guide panel on the left, full-height map on the right. On phones, one view at a time (List / Map).
   Look: "dark SOBRI". Graphite, not black or brown. Cork lives on as the accent colour and as grain. */
:root {
  --bg: #161718;            /* graphite */
  --surface: #1E2022;
  --surface-2: #26292C;
  --line: rgba(237, 233, 227, .09);
  --line-strong: rgba(237, 233, 227, .18);
  --fg: #EDE9E3;            /* warm off-white */
  --muted: #9A968F;
  --cork: #C9A37C;          /* raw cork, the accent */
  --cork-soft: rgba(201, 163, 124, .14);
  --on-cork: #17140F;
  --placeholder: #24221F;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --panel-w: 440px;
  --radius: 14px;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .79  0 0 0 0 .64  0 0 0 0 .49  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cork); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); }

.app { display: grid; grid-template-columns: var(--panel-w) minmax(0, 1fr); height: 100%; overflow: hidden; overflow: clip; }
.panel { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; border-right: 1px solid var(--line); background: var(--bg); }
.panel::before { content: ""; position: absolute; inset: 0; background: var(--grain); opacity: .05; pointer-events: none; }
#map { height: 100%; background: var(--surface); }

/* Header: graphite with cork grain drawn on canvas */
.brand { position: relative; color: var(--fg); background: #1B1B1B; overflow: hidden; flex: none; border-bottom: 1px solid var(--line); }
.brand canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.brand::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22,23,24,0) 30%, rgba(22,23,24,.85) 100%); pointer-events: none; }
.brand-inner { position: relative; z-index: 1; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
.brand-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand-top b { color: var(--cork); font-weight: 500; }
.brand h1 { font-size: 46px; line-height: .95; font-weight: 800; letter-spacing: -.025em; margin: 18px 0 6px; }
.brand h1 span { display: block; font-weight: 400; font-size: 20px; letter-spacing: -.01em; color: var(--muted); margin-top: 8px; }
.tabs { display: flex; gap: 4px; margin-top: 18px; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 10px 2px 12px; margin-right: 18px; font-weight: 500; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--cork); }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding-block: 18px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: transparent; padding: 6px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--fg); transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--muted); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--cork)); }
.chip .n { font: 500 11.5px var(--font-mono); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--cork); color: var(--on-cork); border-color: var(--cork); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .65; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--on-cork); }
.filters.sub { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong); }
.filters.sub .chip { padding: 5px 10px; font-size: 13px; }
.filters.sub .chip[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); border-color: var(--cork); }
.date { padding: 14px 0; border-bottom: 1px solid var(--line); }
.date-d { font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--cork); }
.date h3 { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; }
.date p { margin: 4px 0 0; color: #D9D4CC; max-width: 62ch; }
.sortrow { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 4px; font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sortrow button { border: 0; background: none; color: var(--cork); padding: 4px 0; font: inherit; letter-spacing: inherit; text-transform: inherit; }

/* List */
.group-h { display: flex; align-items: center; gap: 10px; margin: 24px 0 6px; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.group-h .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group-intro { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.card { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 8px; margin: 0 -8px; border-radius: 12px; transition: background .15s; }
.card:hover, .card.hl { background: var(--surface); }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--placeholder); }
.thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.thumb.empty { background: var(--placeholder) var(--grain); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-t { min-width: 0; }
.card-t h3 { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -.005em; }
.card-t p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.card-t .meta, .peek .meta { display: flex; align-items: center; gap: 6px; font: 500 11px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; margin-top: 6px; color: var(--muted); }
.meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

/* Detail */
.back { border: 0; background: none; padding: 6px 0; font: 500 11.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--fg); }
.cover { margin: 10px 0 0; border-radius: var(--radius); overflow: hidden; background: var(--placeholder); aspect-ratio: 3 / 2; max-width: 100%; }
.cover button { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover.empty { display: grid; place-items: center; color: var(--muted); font-size: 13px; aspect-ratio: 3 / 1; }
.gallery { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
.gallery button { flex: none; width: 64px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: none; }
.gallery button[aria-current="true"] { border-color: var(--cork); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.d-cat { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.d-cat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.detail h2 { font-size: 34px; line-height: 1.02; font-weight: 800; letter-spacing: -.025em; margin-top: 8px; }
.detail .tagline { font-size: 17px; color: var(--muted); margin: 6px 0 0; }
.stars { margin-top: 10px; color: var(--cork); letter-spacing: 2px; font-size: 17px; }
.stars small { letter-spacing: .04em; color: var(--muted); font: 500 11px var(--font-mono); text-transform: uppercase; margin-left: 6px; }
.review { margin-top: 20px; }
.review-h { font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cork); margin-bottom: 6px; }
.review p { margin: 0 0 12px; max-width: 62ch; color: #D9D4CC; }
.facts { display: grid; gap: 0; margin: 20px 0 0; border-top: 1px solid var(--line); font-size: 14px; }
.facts div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font: 500 11px/1.9 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts dd.mono { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: 14px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--cork); color: var(--on-cork); border-color: var(--cork); font-weight: 600; }
.btn.primary:hover { background: #D6B38E; }
.nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.nav-row button { border: 0; background: none; color: var(--muted); font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 0; text-align: left; }
.nav-row button:last-child { text-align: right; }
.nav-row b { display: block; color: var(--fg); font: 600 15px var(--font-body); letter-spacing: 0; text-transform: none; margin-top: 3px; }

/* Welcome */
.welcome h2 { font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.02; }
.welcome p { max-width: 62ch; margin: 12px 0 0; color: #D9D4CC; }
.sign { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-top: 16px; color: var(--cork); }
.welcome .actions { margin-top: 22px; }
.how { margin-top: 30px; display: grid; gap: 0; border-top: 1px solid var(--line); }
.how div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; color: var(--muted); font-size: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.how .k { font: 500 11px/1.9 var(--font-mono); color: var(--cork); }
.how b { color: var(--fg); font-weight: 600; }
.ideas { margin-top: 28px; }
.ideas ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 2px; }
.ideas a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.ideas a:hover { color: var(--cork); }
.ideas a span { color: var(--muted); font-size: 13.5px; text-align: right; }
.foot { margin-top: 28px; font: 500 11px/1.6 var(--font-mono); letter-spacing: .03em; color: var(--muted); }

/* Map pins: coloured dots with a graphite ring */
.pin { width: 16px; height: 16px; margin: 5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2.5px #161718, 0 0 0 3.5px rgba(237,233,227,.35), 0 2px 8px rgba(0,0,0,.5); transition: transform .15s; }
.pin.active { transform: scale(1.6); box-shadow: 0 0 0 2.5px #161718, 0 0 0 4px var(--c), 0 4px 14px rgba(0,0,0,.6); }
.pin.dim { opacity: .2; }
.home-pin { width: 34px; height: 34px; border-radius: 10px; background: var(--cork); display: grid; place-items: center; box-shadow: 0 0 0 3px #161718, 0 4px 14px rgba(0,0,0,.55); }
.leaflet-container { font-family: var(--font-body); background: var(--surface); }
#map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(1.22) contrast(.72) saturate(.3) sepia(.12); }
.leaflet-tooltip.tt { font: 500 13px var(--font-body); border-radius: 8px; padding: 5px 9px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line-strong); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.leaflet-tooltip-top.tt::before { border-top-color: var(--surface-2); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface-2); color: var(--fg); border-bottom-color: var(--line); }
.leaflet-bar { border: 1px solid var(--line-strong) !important; box-shadow: 0 4px 14px rgba(0,0,0,.4) !important; }
.leaflet-container .leaflet-control-attribution { background: rgba(22,23,24,.75); color: var(--muted); font: 10px var(--font-mono); }
.leaflet-control-attribution a { color: var(--muted); }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(12,13,14,.94); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 8px; }
.lightbox button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); border: 0; background: rgba(255,255,255,.14); color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 22px; }

/* Phones: map on top, guide below */
@media (max-width: 820px) {
  /* Phones: one view at a time, List or Map, switched from the bottom bar */
  .app { position: relative; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
  .brand-top { display: none; }
  .panel { grid-row: 1; grid-column: 1; border-right: 0; }
  #map { position: absolute; left: 0; right: 0; bottom: 0; top: var(--head-h, 120px); z-index: 1; }
  .app[data-mode="list"] #map { visibility: hidden; pointer-events: none; }
  .app[data-mode="map"] .scroll { visibility: hidden; }
  .modes { display: flex; }
  .pad { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .m-only { display: inline-flex; }
  .leaflet-bottom { bottom: calc(env(safe-area-inset-bottom, 0px)); }
  .brand-inner { padding-top: 12px; }
  .brand h1 { font-size: 30px; margin: 0 0 2px; }
  .brand h1 span { font-size: 17px; display: inline; margin-left: 6px; }
  .tabs { margin-top: 10px; }
  .pad { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .brand-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .pin, .peek { transition: none; } }

/* List / Map switch and pin preview card (phones only) */
.m-only { display: none; }
.modes { display: none; position: fixed; z-index: 1500; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 4px; gap: 4px; border-radius: 999px; background: rgba(30,32,34,.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line-strong); box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.modes button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14.5px; }
.modes button[aria-pressed="true"] { background: var(--cork); color: var(--on-cork); font-weight: 600; }
.modes svg { width: 17px; height: 17px; }
.peek { position: absolute; z-index: 1200; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgba(30,32,34,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line-strong); color: var(--fg); box-shadow: 0 10px 32px rgba(0,0,0,.55); transition: transform .2s ease, opacity .2s ease; }
.peek .thumb { width: 84px; height: 84px; }
.peek h3 { font-size: 17px; font-weight: 600; line-height: 1.2; padding-right: 26px; }
.peek p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.peek .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.peek .peek-actions { display: flex; gap: 8px; margin-top: 8px; }
.peek .btn { padding: 7px 13px; font-size: 13.5px; }
[hidden] { display: none !important; }
@media (max-width: 820px) { .modes { display: flex; } .m-only { display: inline-flex; } }
.peek .x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 20px; line-height: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <canvas id="grain" aria-hidden="true"></canvas>
      <div class="brand-inner">
        <div class="brand-top"><span>SOBRI Cork House</span><span id="year"></span></div>
        <h1>Porto <span>by Cris &amp; David</span></h1>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-welcome" aria-selected="false">Welcome</button>
          <button class="tab" role="tab" id="tab-places" aria-selected="true">Places</button>
        </div>
      </div>
    </header>
    <div class="scroll" id="scroll"><div class="pad" id="view"></div></div>
  </aside>
  <main id="map" aria-label="Map of the places in this guide"></main>
  <div class="peek" id="peek" hidden></div>
  <nav class="modes" aria-label="Switch between list and map">
    <button id="mode-list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>List</button>
    <button id="mode-map" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Map</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  // All guide content lives in data/places.json
  const G = await fetch("data/places.json", { cache: "no-cache" }).then(r => r.json());
  // Sections (Bars & Restaurants, Retail, Culture, Outdoors) and their sub-categories
  const SECS = G.sections;
  const SUB = {};
  Object.entries(SECS).forEach(([sid, s]) => Object.entries(s.subs).forEach(([k, v]) => {
    SUB[k] = { id: k, sec: sid, label: typeof v === "string" ? v : v.label, intro: typeof v === "string" ? "" : (v.intro || "") };
  }));
  const ORDER = Object.keys(SUB);
  const DATES = G.dates || [];
  G.places.forEach(p => { if (!SUB[p.cat]) console.warn("Unknown category for", p.id, p.cat); });
  function subLabel(p) { return SUB[p.cat].label; }
  function secOf(p) { return SUB[p.cat].sec; }
  const HOME = G.home;
  const view = document.getElementById("view");
  const scroller = document.getElementById("scroll");
  document.getElementById("year").innerHTML = HOME.lat.toFixed(4) + "° N &nbsp;" + Math.abs(HOME.lng).toFixed(4) + "° W &nbsp;·&nbsp; <b>" + esc(G.updated) + "</b>";
  function coords(p) { return p.lat.toFixed(4) + "° N, " + Math.abs(p.lng).toFixed(4) + "° W"; }

  // Number places in guide order
  const places = [];
  ORDER.forEach(c => G.places.filter(p => p.cat === c).forEach(p => places.push(p)));
  places.forEach((p, i) => { p.n = i + 1; p.km = distKm(HOME, p); });
  const byId = Object.fromEntries(places.map(p => [p.id, p]));

  let state = { tab: "places", sec: "all", sub: "all", sort: "guide", open: null, peek: null };
  try { const s = JSON.parse(localStorage.getItem("sobri-guide") || "{}"); if (s.sort) state.sort = s.sort; } catch (e) {}

  function save() { try { localStorage.setItem("sobri-guide", JSON.stringify({ sort: state.sort })); } catch (e) {} }

  function distKm(a, b) {
    const R = 6371, t = x => x * Math.PI / 180;
    const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function distLabel(km) {
    const walk = Math.round(km * 1.3 / 4.8 * 60); // streets are not straight lines
    if (walk <= 1) return "Next door";
    if (walk <= 35) return walk + " min walk";
    return (km * 1.3).toFixed(0) + " km away";
  }
  function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function mapsLink(p) { return "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + p.lat + "," + p.lng; }
  function color(p) { return SECS[secOf(p)].color; }
  function matches(p) {
    if (state.sec !== "all" && secOf(p) !== state.sec) return false;
    if (state.sub !== "all" && state.sub !== "dates" && p.cat !== state.sub) return false;
    return true;
  }

  // ---------- Map ----------
  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([HOME.lat, HOME.lng], 14);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const homeIcon = L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17],
    html: '<div class="home-pin" title="SOBRI Cork House"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF6EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg></div>' });
  L.marker([HOME.lat, HOME.lng], { icon: homeIcon, zIndexOffset: 1000, keyboard: false })
    .bindTooltip("You are staying here", { className: "tt", direction: "top", offset: [0, -16] }).addTo(map);

  const markers = {};
  places.forEach(p => {
    const icon = L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
      html: '<div class="pin" style="--c:' + color(p) + '"></div>' });
    const m = L.marker([p.lat, p.lng], { icon, title: p.name, riseOnHover: true }).addTo(map);
    m.bindTooltip(p.name, { className: "tt", direction: "top", offset: [0, -12] });
    m.on("click", () => isPhone() ? showPeek(p) : openPlace(p.id, { fromMap: true }));
    markers[p.id] = m;
  });

  function refreshPins() {
    places.forEach(p => {
      const el = markers[p.id].getElement(); if (!el) return;
      const pin = el.querySelector(".pin");
      const mapMode = isPhone() && document.querySelector(".app").dataset.mode === "map";
      const on = mapMode ? state.peek === p.id : (state.open === p.id || state.peek === p.id);
      pin.classList.toggle("active", on);
      pin.classList.toggle("dim", !matches(p) && !on);
      markers[p.id].setZIndexOffset(on ? 900 : 0);
    });
  }
  function fitTo(list) {
    if (!list.length) return;
    map.invalidateSize();
    const sz = map.getSize(); if (!sz.x || !sz.y) return; // map not laid out yet
    const b = L.latLngBounds(list.map(p => [p.lat, p.lng]));
    map.fitBounds(b.pad(0.1), { maxZoom: 16, animate: true });
  }

  // ---------- Views ----------
  function setTab(t) {
    state.tab = t;
    document.getElementById("tab-welcome").setAttribute("aria-selected", t === "welcome");
    document.getElementById("tab-places").setAttribute("aria-selected", t === "places");
    if (t === "welcome") { state.open = null; renderWelcome(); } else if (state.open) renderDetail(byId[state.open]); else renderList();
    refreshPins();
  }

  function renderWelcome() {
    view.innerHTML =
      '<div class="welcome"><h2>Welcome to Porto</h2>' +
      G.welcome.map(t => "<p>" + esc(t) + "</p>").join("") +
      '<div class="sign">' + esc(G.signoff) + "</div>" +
      '<div class="actions"><button class="btn primary" id="go-places">See the ' + places.length + ' places</button>' +
      G.links.map(l => '<a class="btn" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a>").join("") + "</div>" +
      '<div class="how">' +
      '<div><span class="k">TAP</span><span><b>Tap a pin or a place</b> to read why we like it and see photos.</span></div>' +
      '<div><span class="k">FILTER</span><span><b>Filter</b> by what you feel like: bars and restaurants, culture, the outdoors.</span></div>' +
      '<div><span class="k">GO</span><span><b>Get directions</b> opens Google Maps walking from wherever you are.</span></div>' +
      "</div>" +
      (G.moreIdeas && G.moreIdeas.length ? '<div class="ideas"><div class="group-h">More ideas</div><ul>' +
        G.moreIdeas.map(i => '<li><a href="' + esc(i.url) + '" target="_blank" rel="noopener">' + esc(i.label) + "<span>" + esc(i.note) + "</span></a></li>").join("") + "</ul></div>" : "") +
      '<p class="foot">Times are walking estimates from the Cork House. Opening hours change, so check before you go.</p></div>';
    document.getElementById("go-places").onclick = () => setTab("places");
    scroller.scrollTop = 0;
  }

  function filtered() {
    let list = places.filter(matches);
    if (state.sort === "near") list.sort((a, b) => a.km - b.km);
    return list;
  }

  function cardHTML(p) {
    const has = p.photos && p.photos[0];
    const img = has ? '<img src="' + esc(p.photos[0]) + '" alt="" loading="lazy">' : "";
    return '<button class="card" data-id="' + p.id + '" style="--c:' + color(p) + '">' +
      '<span class="thumb' + (has ? "" : " empty") + '">' + img + "</span>" +
      '<span class="card-t"><h3>' + esc(p.name) + "</h3><p>" + esc(p.tagline) + '</p><div class="meta"><span class="dot"></span>' + esc(subLabel(p)) + " · " + distLabel(p.km) + "</div></span></button>";
  }

  function renderList() {
    const secCount = {}, subCount = {};
    places.forEach(p => { secCount[secOf(p)] = (secCount[secOf(p)] || 0) + 1; subCount[p.cat] = (subCount[p.cat] || 0) + 1; });
    const chip = (attr, val, label, n, pressed, c) => '<button class="chip" ' + attr + '="' + val + '"' + (c ? ' style="--c:' + c + '"' : "") + ' aria-pressed="' + pressed + '">' +
      (c ? '<span class="dot"></span>' : "") + esc(label) + (n != null ? ' <span class="n">' + n + "</span>" : "") + "</button>";

    // Row 1: sections (hidden when empty)
    const secChips = [chip("data-sec", "all", "All", places.length, state.sec === "all")]
      .concat(Object.keys(SECS).filter(s => secCount[s] || (s === "culture" && DATES.length))
        .map(s => chip("data-sec", s, SECS[s].label, secCount[s] || 0, state.sec === s, SECS[s].color)));
    // Row 2: sub-categories of the chosen section
    let subRow = "";
    if (state.sec !== "all") {
      const subs = Object.values(SUB).filter(s => s.sec === state.sec && subCount[s.id]);
      const subChips = [chip("data-sub", "all", "All " + SECS[state.sec].label.toLowerCase(), null, state.sub === "all")]
        .concat(subs.map(s => chip("data-sub", s.id, s.label, subCount[s.id], state.sub === s.id)));
      if (state.sec === "culture" && DATES.length) subChips.push(chip("data-sub", "dates", "Key dates", DATES.length, state.sub === "dates"));
      subRow = '<div class="filters sub" role="group" aria-label="Filter ' + esc(SECS[state.sec].label) + '">' + subChips.join("") + "</div>";
    }

    const list = filtered();
    let body = "";
    const datesHTML = () => '<div class="group-h" style="--c:' + SECS.culture.color + '"><span class="dot"></span>Key dates</div>' +
      DATES.map(d => '<div class="date"><div class="date-d">' + esc(d.date) + "</div><h3>" + esc(d.name) + "</h3><p>" + esc(d.text) + "</p></div>").join("");
    if (state.sub === "dates") {
      body = datesHTML();
    } else if (state.sort === "near") {
      body = list.map(cardHTML).join("");
    } else if (state.sec === "all") {
      Object.keys(SECS).forEach(s => {
        const items = list.filter(p => secOf(p) === s); if (!items.length) return;
        body += '<div class="group-h" style="--c:' + SECS[s].color + '"><span class="dot"></span>' + esc(SECS[s].label) + "</div>" + items.map(cardHTML).join("");
      });
    } else {
      ORDER.forEach(c => {
        const items = list.filter(p => p.cat === c); if (!items.length) return;
        const s = SUB[c];
        body += '<div class="group-h" style="--c:' + SECS[s.sec].color + '"><span class="dot"></span>' + esc(s.label) + "</div>" + (s.intro ? '<p class="group-intro">' + esc(s.intro) + "</p>" : "") + items.map(cardHTML).join("");
      });
      if (state.sec === "culture" && state.sub === "all" && DATES.length) body += datesHTML();
    }
    view.innerHTML = '<div class="filters" role="group" aria-label="Filter places">' + secChips.join("") + "</div>" + subRow +
      (state.sub === "dates" ? "" : '<div class="sortrow"><span>' + (state.sort === "near" ? "Nearest to the Cork House first" : "In guide order") + '</span><button id="sort">' + (state.sort === "near" ? "Guide order" : "Nearest first") + "</button></div>") + body;

    view.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => {
      state.sec = b.dataset.sec; state.sub = "all"; renderList(); refreshPins();
      fitTo(places.filter(matches));
    });
    view.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => {
      state.sub = b.dataset.sub; renderList(); refreshPins();
      if (state.sub !== "dates") fitTo(places.filter(matches));
    });
    const sortBtn = document.getElementById("sort");
    if (sortBtn) sortBtn.onclick = () => { state.sort = state.sort === "near" ? "guide" : "near"; save(); renderList(); };
    view.querySelectorAll(".card").forEach(b => {
      b.onclick = () => openPlace(b.dataset.id);
      b.onmouseenter = () => markers[b.dataset.id].getElement()?.querySelector(".pin").classList.add("active");
      b.onmouseleave = () => { if (state.open !== b.dataset.id) markers[b.dataset.id].getElement()?.querySelector(".pin").classList.remove("active"); };
    });
  }

  function renderDetail(p) {
    const photos = p.photos || [];
    const list = filtered(); const i = list.findIndex(x => x.id === p.id);
    const prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
    const stars = p.rating ? '<div class="stars" aria-label="' + p.rating + ' out of 5">' + "★".repeat(p.rating) + "☆".repeat(5 - p.rating) + (p.visited ? "<small>Last visit " + esc(p.visited) + "</small>" : "") + "</div>"
      : (p.visited ? '<div class="stars"><small style="margin:0">Last visit ' + esc(p.visited) + "</small></div>" : "");
    view.innerHTML =
      '<div class="detail" style="--c:' + color(p) + '">' +
      '<button class="back" id="back">← All places</button>' +
      (photos.length ? '<div class="cover"><button id="zoom" aria-label="View photo larger"><img id="cover-img" src="' + esc(photos[0]) + '" alt="' + esc(p.name) + '"></button></div>' : "") +
      (photos.length > 1 ? '<div class="gallery">' + photos.map((s, k) => '<button data-k="' + k + '" aria-current="' + (k === 0) + '"><img src="' + esc(s) + '" alt="Photo ' + (k + 1) + '" loading="lazy"></button>').join("") + "</div>" : "") +
      '<div class="d-cat"><span class="dot"></span>' + esc(SECS[secOf(p)].label) + " · " + esc(subLabel(p)) + "</div>" +
      "<h2>" + esc(p.name) + '</h2><p class="tagline">' + esc(p.tagline) + "</p>" + stars +
      '<div class="review"><div class="review-h">Why we like it</div>' + p.review.split(/\n\s*\n/).map(t => "<p>" + esc(t) + "</p>").join("") + "</div>" +
      '<dl class="facts">' +
      (p.address ? "<div><dt>Address</dt><dd>" + esc(p.address) + "</dd></div>" : "") +
      (p.phone ? '<div><dt>Phone</dt><dd><a href="tel:' + esc(p.phone.replace(/\s/g, "")) + '">' + esc(p.phone) + "</a></dd></div>" : "") +
      "<div><dt>From home</dt><dd>" + distLabel(p.km) + "</dd></div>" +
      '<div><dt>Coordinates</dt><dd class="mono">' + coords(p) + "</dd></div></dl>" +
      '<div class="actions"><a class="btn primary" href="' + mapsLink(p) + '" target="_blank" rel="noopener">Get directions</a>' +
      '<button class="btn m-only" id="show-on-map">Show on map</button>' +
      (p.website ? '<a class="btn" href="' + esc(p.website) + '" target="_blank" rel="noopener">Website</a>' : "") + "</div>" +
      '<div class="nav-row">' + (prev ? '<button data-go="' + prev.id + '">Previous<b>' + esc(prev.name) + "</b></button>" : "<span></span>") +
      (next ? '<button data-go="' + next.id + '">Next<b>' + esc(next.name) + "</b></button>" : "<span></span>") + "</div></div>";

    document.getElementById("back").onclick = closePlace;
    document.getElementById("show-on-map").onclick = () => { setMode("map"); showPeek(p); };
    view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => openPlace(b.dataset.go));
    let cur = 0;
    view.querySelectorAll(".gallery button").forEach(b => b.onclick = () => {
      cur = +b.dataset.k; document.getElementById("cover-img").src = photos[cur];
      view.querySelectorAll(".gallery button").forEach(x => x.setAttribute("aria-current", x === b));
    });
    const z = document.getElementById("zoom"); if (z) z.onclick = () => lightbox(photos[cur], p.name);
    scroller.scrollTop = 0;
  }

  function openPlace(id, opts) {
    const p = byId[id]; if (!p) return;
    state.open = id; state.tab = "places";
    document.getElementById("tab-welcome").setAttribute("aria-selected", "false");
    document.getElementById("tab-places").setAttribute("aria-selected", "true");
    renderDetail(p); refreshPins();
    const z = Math.max(map.getZoom(), 15);
    map.flyTo([p.lat, p.lng], z, { duration: 0.5 });
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    if (window.matchMedia("(max-width: 820px)").matches && opts && opts.fromMap) scroller.scrollTop = 0;
  }
  function closePlace() {
    const id = state.open; state.open = null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    renderList(); refreshPins();
    const c = view.querySelector('.card[data-id="' + id + '"]');
    if (c) { c.scrollIntoView({ block: "center" }); c.classList.add("hl"); setTimeout(() => c.classList.remove("hl"), 1200); }
  }

  function lightbox(src, alt) {
    const d = document.createElement("div"); d.className = "lightbox";
    d.innerHTML = '<img src="' + esc(src) + '" alt="' + esc(alt) + '"><button aria-label="Close">×</button>';
    const close = () => { d.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    d.onclick = close; document.addEventListener("keydown", onKey);
    document.body.appendChild(d); d.querySelector("button").focus();
  }

  // ---------- Phones: List / Map switch and pin card ----------
  const app = document.querySelector(".app");
  const peek = document.getElementById("peek");
  app.dataset.mode = "list";
  function isPhone() { return window.matchMedia("(max-width: 820px)").matches; }
  function setHeadHeight() { app.style.setProperty("--head-h", document.querySelector(".brand").offsetHeight + "px"); }
  function setMode(m) {
    app.dataset.mode = m;
    document.getElementById("mode-list").setAttribute("aria-pressed", m === "list");
    document.getElementById("mode-map").setAttribute("aria-pressed", m === "map");
    if (m === "map") {
      setHeadHeight(); map.invalidateSize(); firstFit();
      if (!setMode.shown && !state.peek) { setMode.shown = true; fitTo(places.filter(p => p.km < 1).concat([HOME])); }
    }
    else hidePeek();
  }
  function showPeek(p) {
    state.peek = p.id; refreshPins();
    const img = p.photos && p.photos[0] ? '<img src="' + esc(p.photos[0]) + '" alt="">' : "";
    peek.style.setProperty("--c", color(p));
    peek.innerHTML = '<span class="thumb' + (img ? "" : " empty") + '">' + img + "</span>" +
      '<div style="min-width:0"><h3>' + esc(p.name) + "</h3><p>" + esc(p.tagline) + '</p><div class="meta"><span class="dot"></span>' + esc(subLabel(p)) + " · " + distLabel(p.km) + "</div>" +
      '<div class="peek-actions"><button class="btn primary" id="peek-open">See details</button>' +
      '<a class="btn" href="' + mapsLink(p) + '" target="_blank" rel="noopener">Directions</a></div></div>' +
      '<button class="x" id="peek-x" aria-label="Close">×</button>';
    peek.hidden = false;
    document.getElementById("peek-open").onclick = () => { hidePeek(); setMode("list"); openPlace(p.id); };
    document.getElementById("peek-x").onclick = hidePeek;
    map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration: 0.4 });
  }
  function hidePeek() { peek.hidden = true; state.peek = null; refreshPins(); }
  document.getElementById("mode-list").onclick = () => setMode("list");
  document.getElementById("mode-map").onclick = () => setMode("map");
  map.on("click", () => { if (!peek.hidden) hidePeek(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !peek.hidden) hidePeek(); });
  window.addEventListener("resize", () => { setHeadHeight(); if (!isPhone()) { hidePeek(); app.dataset.mode = "list"; } });
  setHeadHeight();

  document.getElementById("tab-welcome").onclick = () => { setMode("list"); setTab("welcome"); };
  document.getElementById("tab-places").onclick = () => { setMode("list"); state.open = null; setTab("places"); };

  // ---------- Cork grain on the header ----------
  function grain() {
    const c = document.getElementById("grain"), r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = r.width * dpr; c.height = r.height * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    // Cork grain: warm cork flecks and dark pores on graphite
    const n = Math.round(r.width * r.height / 22);
    for (let i = 0; i < n; i++) {
      const px = rnd() * r.width, py = rnd() * r.height, s = rnd();
      x.fillStyle = s > 0.5 ? "rgba(201,163,124," + (0.08 + rnd() * 0.32) + ")" : "rgba(0,0,0," + (0.25 + rnd() * 0.45) + ")";
      x.beginPath(); x.ellipse(px, py, 0.5 + rnd() * 2.2, 0.4 + rnd() * 1.4, rnd() * Math.PI, 0, Math.PI * 2); x.fill();
    }
  }
  grain(); window.addEventListener("resize", () => { grain(); });

  // ---------- Start ----------
  const start = location.hash.slice(1);
  if (start === "welcome") setTab("welcome");
  else if (byId[start]) { renderList(); openPlace(start); }
  else { setTab("places"); }
  // Zoom to the centre once the map has a real size (it can be 0 while the page is still laying out)
  let fitted = false;
  function firstFit() {
    if (fitted) return;
    map.invalidateSize();
    const sz = map.getSize(); if (!sz.x || !sz.y) return;
    fitted = true;
    if (state.open) map.setView([byId[state.open].lat, byId[state.open].lng], 16);
    else fitTo(places.filter(p => p.km < 2.5).concat([HOME]));
    refreshPins();
  }
  if (window.ResizeObserver) new ResizeObserver(() => { map.invalidateSize(); firstFit(); }).observe(document.getElementById("map"));
  map.whenReady(firstFit);
  window.addEventListener("load", firstFit);
  map.on("zoomend moveend", refreshPins);
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (byId[h] && h !== state.open) openPlace(h);
    else if (h === "welcome") setTab("welcome");
  });
})();
</script>
</body>
</html>
